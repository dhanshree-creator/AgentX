[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentx"
version = "1.0.0"
description = "AgentX - Autonomous Task-Solving Agent with LLM tool use (terminal application)"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai>=1.42",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "safety*", "ui*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "tools", "safety", "ui", "evaluation"]
